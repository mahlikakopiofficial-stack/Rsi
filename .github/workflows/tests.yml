name: RSI research checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python files
        run: python -m py_compile backtest.py test_backtest.py
      - name: Run unit tests
        run: python -m unittest -v test_backtest.py
